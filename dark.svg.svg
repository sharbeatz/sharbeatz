            </rect>
            <text x="39" y="20" fill="#F8FAFC" font-size="12" font-weight="600" text-anchor="middle">Figma</text>
          </g>
        </g>
      </g>

      <!-- Social (Only GitHub) -->
      <g transform="translate(0, 410)">
        <g transform="translate(0, 0)">
          <circle cx="16" cy="16" r="16" fill="#1E293B" fill-opacity="0.8" />
          <circle cx="16" cy="16" r="15.5" fill="none" stroke="#22D3EE" stroke-opacity="0.5" />
          <path d="M16 5C9.9 5 5 9.9 5 16c0 4.9 3.2 9 7.6 10.5.5.1.7-.2.7-.5v-1.9c-3.1.7-3.7-1.5-3.7-1.5-.5-1.3-1.3-1.7-1.3-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.8 2.7 1.3 3.3 1 .1-.8.4-1.3.8-1.6-2.5-.3-5.1-1.2-5.1-5.5 0-1.2.4-2.2 1.1-3-.1-.3-.5-1.4.1-3 0 0 .9-.3 3 1.1.9-.3 1.9-.4 2.8-.4.9 0 1.9.1 2.8.4 2.1-1.4 3-1.1 3-1.1.6 1.6.2 2.7.1 3 .7.8 1.1 1.8 1.1 3 0 4.3-2.6 5.2-5.2 5.5.4.4.8 1.1.8 2.2v3.3c0 .3.2.6.7.5C23.8 25 27 20.9 27 16c0-6.1-4.9-11-11-11z" fill="#F8FAFC" transform="scale(0.8) translate(4, 4)" />
          <text x="44" y="21" fill="#F8FAFC" font-size="13" font-weight="600" font-family="monospace">github/ArthurSH</text>
